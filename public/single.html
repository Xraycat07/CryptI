<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crypto-api chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/strategy.js"></script>
<script src="/fx.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --up: #26a69a;
    --down: #ef5350;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 16px 0 0;
    white-space: nowrap;
  }
  nav { display: flex; gap: 14px; }
  nav a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
  }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  nav a:hover { color: var(--text); }
  .luno-link {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .luno-link:hover { color: var(--text); border-color: var(--accent); }
  .luno-link.active { color: var(--text); border-color: var(--accent); background: rgba(79,140,255,0.12); }
  label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  select, input, button {
    background: #0e1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  input[type=number] { width: 70px; }
  button {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }
  #meta {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #price { font-size: 15px; font-weight: 600; color: var(--text); }
  #change.up { color: var(--up); }
  #change.down { color: var(--down); }
  #prediction { font-size: 12px; }
  #prediction .pred-up { color: var(--up); }
  #prediction .pred-down { color: var(--down); }
  #chart-container { position: relative; width: 100%; height: calc(100vh - 61px); }
  #status {
    position: absolute;
    top: 10px;
    left: 20px;
    font-size: 12px;
    color: var(--muted);
    z-index: 2;
  }
  #status.error { color: var(--down); }
  #predictionNote {
    position: absolute;
    top: 32px;
    left: 20px;
    font-size: 11px;
    color: var(--muted);
    z-index: 2;
  }
  #strategyNote {
    position: absolute;
    top: 50px;
    left: 20px;
    font-size: 11px;
    color: var(--muted);
    z-index: 2;
  }
  #strategyNote a { color: var(--accent); }
  #strategySummary {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 12px;
    z-index: 2;
    text-align: right;
  }
  #strategySummary .up { color: var(--up); }
  #strategySummary .down { color: var(--down); }
</style>
</head>
<body>

<header>
  <h1>crypto-api</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/single.html" class="active">Single-coin</a>
    <a href="/trends.html">Trends</a>
    <a href="/indicators.html">Indicators</a>
    <a href="/predictions.html">Predictions</a>
    <a href="/performance.html">Performance</a>
    <a href="/stocks.html">Stocks</a>
    <a href="/news.html">News</a>
  </nav>
  <a href="/luno.html" class="luno-link">🔒 Luno</a>
  <label>Coin
    <select id="coin">
      <option value="bitcoin">BTC</option>
      <option value="ethereum">ETH</option>
      <option value="ripple" selected>XRP</option>
      <option value="litecoin">LTC</option>
      <option value="dogecoin">DOGE</option>
      <option value="solana">SOL</option>
      <option value="cardano">ADA</option>
      <option value="polkadot">DOT</option>
      <option value="chainlink">LINK</option>
      <option value="avalanche-2">AVAX</option>
      <option value="polygon-ecosystem-token">POL</option>
      <option value="uniswap">UNI</option>
    </select>
  </label>
  <label>Interval
    <select id="interval">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="6h">6h</option>
      <option value="12h">12h</option>
      <option value="1d" selected>1d</option>
      <option value="3d">3d</option>
      <option value="1w">1w</option>
      <option value="2w">2w</option>
      <option value="1M">1M</option>
      <option value="3M">3M</option>
      <option value="6M">6M</option>
      <option value="1Y">1Y</option>
      <option value="2Y">2Y</option>
    </select>
  </label>
  <label>Currency
    <select id="currency">
      <option value="USD">USD $</option>
      <option value="ZAR">ZAR R</option>
    </select>
  </label>
  <label>Candles
    <input type="number" id="limit" value="180" min="10" max="1000">
  </label>
  <button id="refresh">Refresh</button>
  <label><input type="checkbox" id="auto"> Auto-refresh (60s)</label>
  <label><input type="checkbox" id="strategyToggle"> Strategy</label>
  <div id="meta">
    <span id="price">—</span>
    <span id="change">—</span>
    <span id="prediction">—</span>
  </div>
</header>

<div id="chart-container">
  <div id="status"></div>
  <div id="predictionNote">Dashed segment is a naive linear trend projection, not a price forecast.</div>
  <div id="strategyNote" hidden>Using the strategy config from <a href="/indicators.html">Indicators</a>.</div>
  <div id="strategySummary"></div>
</div>

<script>
const API_BASE = ""; // same origin

const chart = LightweightCharts.createChart(document.getElementById("chart-container"), {
  layout: {
    background: { color: "#0e1117" },
    textColor: "#8b93a1",
  },
  grid: {
    vertLines: { color: "#1c212b" },
    horzLines: { color: "#1c212b" },
  },
  timeScale: { timeVisible: true, secondsVisible: false },
  rightPriceScale: { borderColor: "#2a2f3a" },
});

const series = chart.addCandlestickSeries({
  upColor: "#26a69a",
  downColor: "#ef5350",
  borderVisible: false,
  wickUpColor: "#26a69a",
  wickDownColor: "#ef5350",
});
const predSeries = chart.addLineSeries({
  color: "#4f8cff", lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed,
  lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
});
const PROJECT_BARS = 10;

function resizeChart() {
  const el = document.getElementById("chart-container");
  chart.resize(el.clientWidth, el.clientHeight);
}
window.addEventListener("resize", resizeChart);
resizeChart();

const statusEl = document.getElementById("status");
const priceEl = document.getElementById("price");
const changeEl = document.getElementById("change");
const refreshBtn = document.getElementById("refresh");
const autoCheckbox = document.getElementById("auto");

let autoTimer = null;
let requestSeq = 0; // guards against a slower stale request overwriting a newer one
let lastCandlesUsd = null;
let currentCurrency = "USD";
let currentRate = 1;

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? "error" : "";
}

function renderCandles(candlesUsd) {
  if (!candlesUsd || !candlesUsd.length) return;
  const conv = (v) => FX.convert(v, currentCurrency, currentRate);
  const candles = candlesUsd.map(c => ({ ...c, open: conv(c.open), high: conv(c.high), low: conv(c.low), close: conv(c.close) }));

  series.setData(candles.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));

  const last = candles[candles.length - 1];
  const first = candles[0];
  const pct = ((last.close - first.open) / first.open) * 100;
  priceEl.textContent = FX.formatMoney(candlesUsd[candlesUsd.length - 1].close, currentCurrency, currentRate);
  changeEl.textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "% (range)";
  changeEl.className = pct >= 0 ? "up" : "down";

  // Naive linear-trend projection, capped relative to available history
  // so a handful of candles (e.g. a 1Y view) don't get extrapolated wildly.
  const projectBars = Math.max(2, Math.min(PROJECT_BARS, Math.floor(candles.length * 0.3)));
  const closes = candles.map(c => c.close);
  const times = candles.map(c => c.time);
  const projectedCloses = Strategy.projectForward(closes, projectBars);
  const projectedTimes = Strategy.extendTimes(times, projectBars);
  predSeries.setData([{ time: last.time, value: last.close }, ...projectedTimes.map((t, i) => ({ time: t, value: projectedCloses[i] }))]);
  const predPct = ((projectedCloses[projectedCloses.length - 1] - last.close) / last.close) * 100;
  const predEl = document.getElementById("prediction");
  predEl.innerHTML = `Projected ${projectBars} bars: <span class="${predPct >= 0 ? "pred-up" : "pred-down"}">${predPct >= 0 ? "+" : ""}${predPct.toFixed(2)}%</span>`;

  renderStrategyOverlay(candles);

  chart.timeScale().fitContent();
}

// ---------- strategy overlay (shares config saved from the Indicators tab) ----------
let zonePriceLines = [];
let trendLineSeriesList = [];

function clearStrategyOverlay() {
  for (const line of zonePriceLines) series.removePriceLine(line);
  zonePriceLines = [];
  for (const s of trendLineSeriesList) chart.removeSeries(s);
  trendLineSeriesList = [];
  series.setMarkers([]);
  document.getElementById("strategySummary").textContent = "";
}

function renderStrategyOverlay(candles) {
  clearStrategyOverlay();
  const toggle = document.getElementById("strategyToggle");
  document.getElementById("strategyNote").hidden = !toggle.checked;
  if (!toggle.checked || candles.length < 10) return;

  const cfg = Strategy.loadStoredStrategyConfig();
  const result = Strategy.runStrategy(candles, cfg);

  if (cfg.indicators.srZones.enabled) {
    for (const z of result.zones) {
      const color = z.type === "support" ? "#26a69a" : "#ef5350";
      const label = (z.type === "support" ? "S " : "R ") + "×" + z.touches;
      zonePriceLines.push(series.createPriceLine({
        price: z.priceHigh, color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted,
        axisLabelVisible: true, title: label,
      }));
      zonePriceLines.push(series.createPriceLine({
        price: z.priceLow, color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted,
        axisLabelVisible: true, title: "",
      }));
    }
  }

  if (cfg.indicators.trendlines.enabled) {
    const lastTime = candles[candles.length - 1].time;
    for (const line of result.trendlines) {
      const color = line.direction === "up" ? "#26a69a" : "#ef5350";
      const lineSeries = chart.addLineSeries({
        color, lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed,
        lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
      });
      lineSeries.setData([
        { time: line.t0, value: line.p0 },
        { time: lastTime, value: Strategy.lineValueAt(line, lastTime) },
      ]);
      trendLineSeriesList.push(lineSeries);
    }
  }

  series.setMarkers(result.signals.map(s => ({
    time: s.time,
    position: s.side === "buy" ? "belowBar" : "aboveBar",
    color: s.side === "buy" ? "#26a69a" : "#ef5350",
    shape: s.side === "buy" ? "arrowUp" : "arrowDown",
    text: s.side.toUpperCase(),
  })));

  const buys = result.signals.filter(s => s.side === "buy").length;
  const sells = result.signals.filter(s => s.side === "sell").length;
  const stats = Strategy.summarizeBacktest(Strategy.backtestSignals(candles, result.signals));
  const winRateText = stats.winRatePct != null ? `${stats.winRatePct.toFixed(0)}% win rate` : "no closed trades yet";
  document.getElementById("strategySummary").innerHTML =
    `<span class="up">${buys} buy</span> &middot; <span class="down">${sells} sell</span> &middot; ${winRateText}`;
}

document.getElementById("strategyToggle").addEventListener("change", () => renderCandles(lastCandlesUsd));

FX.bindCurrencySelect(document.getElementById("currency"), (currency, rate) => {
  currentCurrency = currency;
  currentRate = rate;
  renderCandles(lastCandlesUsd);
});

async function loadCandles() {
  const coin = document.getElementById("coin").value;
  const interval = document.getElementById("interval").value;
  const limit = document.getElementById("limit").value;
  const mySeq = ++requestSeq;

  refreshBtn.disabled = true;
  setStatus("Loading…");

  try {
    const res = await fetch(`${API_BASE}/api/candles/${coin}?interval=${interval}&limit=${limit}`);
    const body = await res.json();
    if (mySeq !== requestSeq) return; // a newer request has since started — discard this one
    if (!res.ok) throw new Error(body.error || res.statusText);
    if (!body.candles.length) throw new Error("No candle data for this coin/interval");

    lastCandlesUsd = body.candles;
    renderCandles(lastCandlesUsd);

    setStatus("Updated " + new Date().toLocaleTimeString());
  } catch (err) {
    setStatus("Error: " + err.message, true);
  } finally {
    refreshBtn.disabled = false;
  }
}

const intervalSelect = document.getElementById("interval");
const coinSelect = document.getElementById("coin");

// Disables intervals this coin doesn't have enough stored history for
// (e.g. 2Y on a recently-listed coin), falling back to the largest
// available one if the current selection just became invalid.
async function updateIntervalAvailability(coin) {
  try {
    const res = await fetch(`${API_BASE}/api/coins/${coin}/history-info`);
    const info = await res.json();
    if (res.ok) Strategy.applyIntervalAvailability(intervalSelect, info.storedDays);
  } catch {
    // best-effort — leave intervals as-is if this lookup fails
  }
}

refreshBtn.addEventListener("click", loadCandles);
coinSelect.addEventListener("change", async () => {
  await updateIntervalAvailability(coinSelect.value);
  loadCandles();
});
intervalSelect.addEventListener("change", loadCandles);

autoCheckbox.addEventListener("change", () => {
  if (autoCheckbox.checked) {
    autoTimer = setInterval(loadCandles, 60000);
  } else {
    clearInterval(autoTimer);
  }
});

updateIntervalAvailability(coinSelect.value).then(loadCandles);
</script>
<script src="/luno-badge.js"></script>

</body>
</html>
