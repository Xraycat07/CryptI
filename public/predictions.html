<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crypto-api predictions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --up: #26a69a;
    --down: #ef5350;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 8px 0 0;
    white-space: nowrap;
  }
  nav { display: flex; gap: 14px; }
  nav a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
  }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  nav a:hover { color: var(--text); }
  .luno-link {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .luno-link:hover { color: var(--text); border-color: var(--accent); }
  .luno-link.active { color: var(--text); border-color: var(--accent); background: rgba(79,140,255,0.12); }
  label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  select, input {
    background: #0e1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  input[type=number] { width: 60px; }
  button {
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-weight: 500;
    padding: 6px 10px;
    font-size: 13px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 12px; color: var(--muted); }
  #status.error { color: var(--down); }

  main { padding: 20px; }

  .disclaimer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .disclaimer strong { color: var(--text); }
  #summary { font-size: 12px; color: var(--text); white-space: nowrap; }
  #summary .up { color: var(--up); font-weight: 600; }
  #summary .down { color: var(--down); font-weight: 600; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 14px;
    text-align: right;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  th:first-child, td:first-child { text-align: left; }
  th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }
  td.coin { font-weight: 600; }
  td.up { color: var(--up); }
  td.down { color: var(--down); }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.up { background: rgba(38,166,154,0.15); color: var(--up); }
  .badge.down { background: rgba(239,83,80,0.15); color: var(--down); }
  .spark { vertical-align: middle; }
  .empty-note { text-align: center; color: var(--muted); padding: 30px 0; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>crypto-api</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/single.html">Single-coin</a>
    <a href="/trends.html">Trends</a>
    <a href="/indicators.html">Indicators</a>
    <a href="/predictions.html" class="active">Predictions</a>
    <a href="/news.html">News</a>
  </nav>
  <a href="/luno.html" class="luno-link">🔒 Luno</a>
  <label>Interval
    <select id="interval">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="6h">6h</option>
      <option value="12h">12h</option>
      <option value="1d" selected>1d</option>
      <option value="3d">3d</option>
      <option value="1w">1w</option>
      <option value="2w">2w</option>
      <option value="1M">1M</option>
      <option value="3M">3M</option>
      <option value="6M">6M</option>
      <option value="1Y">1Y</option>
      <option value="2Y">2Y</option>
    </select>
  </label>
  <label>Bars ahead
    <input type="number" id="bars" value="10" min="2" max="30">
  </label>
  <label>Currency
    <select id="currency">
      <option value="USD">USD $</option>
      <option value="ZAR">ZAR R</option>
    </select>
  </label>
  <button id="refresh">Refresh</button>
  <span id="status"></span>
</header>

<main>
  <div class="disclaimer">
    <span><strong>Naive linear projection</strong> per coin — a least-squares line through recent closes, extended forward. Not a forecast, not financial advice.</span>
    <span id="summary">—</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Coin</th>
        <th>Price</th>
        <th>Projected</th>
        <th>Change</th>
        <th>Direction</th>
        <th>History + projection</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script src="/strategy.js"></script>
<script src="/fx.js"></script>
<script>
const API_BASE = "";
const COINS = [
  { id: "bitcoin",  label: "BTC" },
  { id: "ethereum", label: "ETH" },
  { id: "ripple",   label: "XRP" },
  { id: "litecoin", label: "LTC" },
  { id: "dogecoin", label: "DOGE" },
  { id: "solana",   label: "SOL" },
  { id: "cardano",  label: "ADA" },
  { id: "polkadot", label: "DOT" },
  { id: "chainlink", label: "LINK" },
  { id: "avalanche-2", label: "AVAX" },
  { id: "polygon-ecosystem-token", label: "POL" },
  { id: "uniswap",  label: "UNI" },
];

const statusEl = document.getElementById("status");
const rowsEl = document.getElementById("rows");
const summaryEl = document.getElementById("summary");
const refreshBtn = document.getElementById("refresh");

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? "error" : "";
}

let currentCurrency = "USD";
let currentRate = 1;

function fmtPrice(usdPrice) {
  return FX.formatMoney(usdPrice, currentCurrency, currentRate);
}

function fmtPct(p) {
  return (p >= 0 ? "+" : "") + p.toFixed(2) + "%";
}

// Solid history, dashed projection continuing from the same last point —
// same convention used on the Dashboard and Single-coin charts.
function sparklineWithProjection(historyCloses, projectedCloses, width = 120, height = 32) {
  const all = [...historyCloses, ...projectedCloses];
  const min = Math.min(...all), max = Math.max(...all);
  const range = max - min || 1;
  const totalSteps = historyCloses.length - 1 + projectedCloses.length;
  const xAt = (i) => (totalSteps <= 0 ? 0 : (i / totalSteps) * width);
  const yAt = (v) => height - ((v - min) / range) * height;

  const histPts = historyCloses.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
  const projPts = [
    `${xAt(historyCloses.length - 1).toFixed(1)},${yAt(historyCloses[historyCloses.length - 1]).toFixed(1)}`,
    ...projectedCloses.map((v, i) => `${xAt(historyCloses.length + i).toFixed(1)},${yAt(v).toFixed(1)}`),
  ].join(" ");

  const up = projectedCloses[projectedCloses.length - 1] >= historyCloses[historyCloses.length - 1];
  const color = up ? "#26a69a" : "#ef5350";
  return `<svg class="spark" width="${width}" height="${height}">
    <polyline points="${histPts}" fill="none" stroke="${color}" stroke-width="1.5"/>
    <polyline points="${projPts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  </svg>`;
}

async function fetchCandles(coinId, interval, limit) {
  const res = await fetch(`${API_BASE}/api/candles/${coinId}?interval=${interval}&limit=${limit}`);
  const body = await res.json();
  if (!res.ok) throw new Error(`${coinId}: ${body.error || res.statusText}`);
  return body.candles;
}

let lastComputed = [];

function renderRows(computed) {
  rowsEl.innerHTML = "";
  if (!computed.length) {
    rowsEl.innerHTML = '<tr><td colspan="6"><div class="empty-note">No data available.</div></td></tr>';
    summaryEl.textContent = "—";
    return;
  }

  const up = computed.filter(r => r.pctChange >= 0).length;
  const down = computed.length - up;
  summaryEl.innerHTML = `<span class="up">${up} up</span> &middot; <span class="down">${down} down</span> of ${computed.length}`;

  for (const row of computed) {
    const tr = document.createElement("tr");
    const dir = row.pctChange >= 0 ? "up" : "down";
    tr.innerHTML = `
      <td class="coin">${row.coin.label}</td>
      <td>${fmtPrice(row.last)}</td>
      <td>${fmtPrice(row.projectedLast)}</td>
      <td class="${dir}">${fmtPct(row.pctChange)}</td>
      <td><span class="badge ${dir}">${dir === "up" ? "▲ up" : "▼ down"}</span></td>
      <td>${sparklineWithProjection(row.historyCloses, row.projectedCloses)}</td>
    `;
    rowsEl.appendChild(tr);
  }
}

FX.bindCurrencySelect(document.getElementById("currency"), (currency, rate) => {
  currentCurrency = currency;
  currentRate = rate;
  renderRows(lastComputed);
});

document.getElementById("bars").addEventListener("change", () => loadPredictions(true));

async function loadPredictions(fromCache) {
  const interval = document.getElementById("interval").value;
  const barsWanted = Math.max(2, Math.min(30, Number(document.getElementById("bars").value) || 10));

  refreshBtn.disabled = true;
  setStatus("Loading…");

  const results = fromCache && lastRawCandles
    ? lastRawCandles
    : await Promise.allSettled(COINS.map(coin => fetchCandles(coin.id, interval, 90)));

  lastRawCandles = results;

  const errors = [];
  const computed = [];

  results.forEach((result, i) => {
    const coin = COINS[i];
    if (result.status === "rejected") {
      errors.push(result.reason.message || String(result.reason));
      return;
    }
    const candles = result.value;
    if (candles.length < 2) return;

    const closes = candles.map(c => c.close);
    const projectBars = Math.max(2, Math.min(barsWanted, Math.floor(closes.length * 0.3)));
    const projected = Strategy.projectForward(closes, projectBars);
    const last = closes[closes.length - 1];
    const projectedLast = projected[projected.length - 1];
    const pctChange = ((projectedLast - last) / last) * 100;

    computed.push({
      coin, last, projectedLast, pctChange,
      historyCloses: closes.slice(-30),
      projectedCloses: projected,
    });
  });

  computed.sort((a, b) => b.pctChange - a.pctChange);
  lastComputed = computed;
  renderRows(computed);

  if (errors.length) {
    setStatus("Partial error: " + errors.join("; "), true);
  } else {
    setStatus("Updated " + new Date().toLocaleTimeString());
  }
  refreshBtn.disabled = false;
}

let lastRawCandles = null;
refreshBtn.addEventListener("click", () => loadPredictions(false));
document.getElementById("interval").addEventListener("change", () => loadPredictions(false));
loadPredictions(false);
</script>

</body>
</html>
