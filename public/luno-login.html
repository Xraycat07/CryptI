<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crypto-api luno login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
  }
  .lock { font-size: 24px; margin-bottom: 6px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: #0e1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-weight: 500;
    padding: 9px 10px;
    font-size: 13px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { font-size: 12px; color: #ef5350; margin-top: 12px; min-height: 14px; }
  a.back { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted); text-decoration: none; }
  a.back:hover { color: var(--text); }
</style>
</head>
<body>

<div class="card">
  <div class="lock">🔒</div>
  <h1>Luno sign in</h1>
  <p class="sub">This section is protected. Sign in to continue.</p>
  <form id="loginForm">
    <label for="user">Username</label>
    <input id="user" name="user" type="text" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit" id="submitBtn">Sign in</button>
    <div class="error" id="error"></div>
  </form>
  <a class="back" href="/">&larr; Back to dashboard</a>
</div>

<script>
const form = document.getElementById("loginForm");
const submitBtn = document.getElementById("submitBtn");
const errorEl = document.getElementById("error");

form.addEventListener("submit", async (evt) => {
  evt.preventDefault();
  submitBtn.disabled = true;
  errorEl.textContent = "";
  try {
    const res = await fetch("/api/luno/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user: document.getElementById("user").value,
        password: document.getElementById("password").value,
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Sign in failed");
    window.location.href = "/luno.html";
  } catch (err) {
    errorEl.textContent = err.message;
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
